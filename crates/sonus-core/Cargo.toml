[package]
name = "sonus-core"
version = "0.2.0"
edition = "2024"
description = "Core backend library for Sonus"

[dependencies]
rodio = "0.21.0"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
ytmapi-rs = { version = "0.3.2", features = ["serde_json"] }
symphonia = { version = "0.6", default-features = false, features = ["aac", "isomp4", "mkv", "vorbis", "ogg"] }
symphonia-adapter-libopus = "0.3"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "time"] }

rusqlite = { version = "0.32.0", features = ["bundled"] }
unicode-width = "0.2"
dirs = "6.0"
zbus = { version = "4", features = ["tokio"] }
souvlaki = { version = "0.8.3", default-features = false, features = ["use_zbus"] }
