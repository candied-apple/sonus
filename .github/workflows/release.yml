name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Binary
        run: cargo build --release

      - name: Install Packaging Tools
        run: |
          cargo install cargo-deb --locked
          cargo install cargo-generate-rpm --locked

      - name: Package Release Assets
        run: |
          mkdir -p dist
          
          # Standard tarball
          cp target/release/sonus dist/
          tar -czvf sonus-linux-x86_64.tar.gz -C dist sonus
          
          # Debian package (.deb)
          cargo deb --manifest-path crates/sonus-tui/Cargo.toml --output dist/
          
          # RPM package (.rpm)
          cd crates/sonus-tui && cargo generate-rpm --output ../../dist/sonus.rpm && cd ../..

      - name: Build Arch Linux Package
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace archlinux:latest bash -c "
            pacman -Syu --noconfirm base-devel rust git yt-dlp alsa-lib
            cd /workspace
            chown -R root:root .
            makepkg -f --noconfirm
          "

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sonus-linux-x86_64.tar.gz
            sonus-*.pkg.tar.zst
            dist/*.deb
            dist/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
